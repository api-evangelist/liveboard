aid: liveboard
name: Liveboard
description: >-
  LiveBoard is a tutor-management platform that helps tutoring businesses,
  academies, and independent tutors run their operations end to end. It combines
  branded virtual classrooms (video calls, screen sharing, an interactive
  whiteboard, recording, and file sharing) with session scheduling and attendance
  tracking, tutor/student/parent management, calendar-based billing with online
  payments, auto-invoicing, payroll, and progress reporting. Liveboard says it
  serves 200,000+ tutors and companies across 200+ countries, scaling from solo
  tutors to organizations with thousands of tutors. It is a consumer/SaaS product
  with no public developer API, SDK, or webhook surface at this time; integrations
  are teaching-focused (Wacom pen tablets, a LaTeX formula editor, and the Desmos
  graphing calculator). Surfaced as a 500 Global portfolio company and added to the
  API Evangelist network.
